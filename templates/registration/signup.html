{% extends 'base.html' %}

{% block title %}Sign up - JobTrack{% endblock %}

{% block content %}
    <h1>Sign up</h1>
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Create Account</button>

    </form>
    <p>Already have an account?<a href="{% url 'login' %}">Login</a></p>

{% endblock %}
